name: Package Chrome Extension

on:
  push:
    branches:
      - main # (Falls dein Branch 'master' heißt, hier ändern!)
    paths:
      - "package.json" # Löst NUR aus, wenn die package.json auf den main-Branch gepusht wird
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for the release (e.g. v1.0.1)"
        required: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # V4 ist die aktuelle Version!

      - name: Setup Node.js
        uses: actions/setup-node@v4 # V4 ist die aktuelle Version!
        with:
          node-version: 24
          cache: "npm"

      - name: Determine Tag Name
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.tag_name }}" ]; then
              echo "tag_name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            else
              VERSION=$(node -p "require('./package.json').version")
              echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT
            fi
          else
            # Wenn es automatisch durch die package.json ausgelöst wird:
            VERSION=$(node -p "require('./package.json').version")
            echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Build Extension
        run: npm run build

      - name: Create ZIP Package
        run: |
          echo "Erstelle easyimagesave.zip aus dem dist-Ordner..."
          cd dist && zip -r ../easyimagesave.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2 # V2 ist die aktuellste offizielle Version
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          files: easyimagesave.zip
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true

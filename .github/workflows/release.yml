name: Package Chrome Extension

on:
  push:
    tags:
      - "v*" # Löst automatisch aus, wenn du einen Tag wie "v1.0.0" pushst
  workflow_dispatch: # Erlaubt dir, die Action JEDERZEIT manuell im "Actions" Tab zu starten
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.0.1)'
        required: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wichtig, damit die Action das Release im Repo erstellen darf
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Determine Tag Name
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.tag_name }}" ]; then
              echo "tag_name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            else
              VERSION=$(node -p "require('./package.json').version")
              echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT
            fi
          else
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Build Extension
        run: npm run build

      - name: Create ZIP Package
        run: |
          echo "Erstelle easyimagesave.zip aus dem dist-Ordner..."
          cd dist && zip -r ../easyimagesave.zip .

      - name: Create GitHub Release
        # Nutzt die aktuelle v3 der Release-Action (Node 24)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          files: easyimagesave.zip
          # Wenn es manuell getriggert wird (ohne Tag), erstellen wir ein "Draft"-Release
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
